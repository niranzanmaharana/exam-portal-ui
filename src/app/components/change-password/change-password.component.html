<div class="change-password-container">
  <div class="change-password-card">
    <div class="card-header">
      <h1>Change Password</h1>
      <p class="subtitle">Update your account password</p>
    </div>

    <form (ngSubmit)="changePassword()" class="password-form">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input 
          type="password" 
          id="currentPassword" 
          [(ngModel)]="passwordForm.currentPassword" 
          name="currentPassword"
          placeholder="Enter current password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          [(ngModel)]="passwordForm.newPassword" 
          name="newPassword"
          placeholder="Enter new password"
          required
          autocomplete="new-password"
        />
        <small class="hint">Password must be at least 6 characters long</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword"
          placeholder="Confirm new password"
          required
          autocomplete="new-password"
        />
      </div>

      <div *ngIf="errorMessage" class="message error-message">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="message success-message">
        <i class="bi bi-check-circle-fill"></i>
        {{ successMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="isLoading">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Change Password</span>
          <span *ngIf="isLoading">Changing...</span>
        </button>
      </div>
    </form>
  </div>
</div>
