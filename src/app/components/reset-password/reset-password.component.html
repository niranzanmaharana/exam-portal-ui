<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="card-header">
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>
    </div>

    <div *ngIf="errorMessage" class="message error-message">
      <i class="bi bi-exclamation-triangle-fill"></i>
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success-message">
      <span class="icon">✓</span>
      {{ successMessage }}
    </div>

    <form *ngIf="!successMessage && token" (ngSubmit)="onSubmit()" class="reset-password-form">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input 
          type="password" 
          id="newPassword" 
          [(ngModel)]="newPassword" 
          name="newPassword"
          placeholder="Enter new password (min 6 characters)"
          required
          minlength="6"
          [disabled]="isLoading"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword"
          placeholder="Confirm new password"
          required
          [disabled]="isLoading"
          class="form-input"
        />
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading">Resetting...</span>
      </button>
    </form>

    <div *ngIf="!token" class="invalid-token-message">
      <p>Invalid or missing reset token. Please request a new password reset.</p>
      <button (click)="goToForgotPassword()" class="btn btn-secondary">
        Request New Reset Link
      </button>
    </div>

    <div class="card-footer">
      <a (click)="goToLogin()" class="link">Back to Login</a>
    </div>
  </div>
</div>
