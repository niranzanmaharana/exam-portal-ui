<header *ngIf="!isPublicExamPage" class="header-wrapper">
  <!-- Main Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center" routerLink="/home">
        <div class="logo-icon me-2">
          <i class="bi bi-journal-bookmark-fill text-primary"></i>
        </div>
        <span class="logo-text fw-bold text-uppercase">Exam Portal</span>
      </a>

      <!-- Mobile Menu Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Menu -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center" *ngIf="authService.isAuthenticated()">
          <li class="nav-item">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/dashboard" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: false}">
              <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin()">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/organizers" routerLinkActive="active">
              <i class="bi bi-people me-1"></i>Organizers
            </a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin() || authService.isOrganizer()">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/categories" routerLinkActive="active">
              <i class="bi bi-folder me-1"></i>Categories
            </a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin() || authService.isOrganizer()">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/exams" routerLinkActive="active">
              <i class="bi bi-file-earmark-text me-1"></i>Exams
            </a>
          </li>
          <li class="nav-item" *ngIf="authService.isAdmin() || authService.isOrganizer()">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/questions" routerLinkActive="active">
              <i class="bi bi-question-circle me-1"></i>Questions
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-uppercase fw-semibold" routerLink="/results" routerLinkActive="active">
              <i class="bi bi-graph-up me-1"></i>Results
            </a>
          </li>

          <!-- User Dropdown -->
          <li class="nav-item dropdown ms-2">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              <span class="user-avatar-badge me-2">{{ userInitial }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0" aria-labelledby="userDropdown">
              <li>
                <div class="dropdown-header bg-primary text-white">
                  <div class="d-flex align-items-center">
                    <div class="user-avatar-large me-3">{{ userInitial }}</div>
                    <div>
                      <div class="fw-bold text-capitalize">{{ authService.getCurrentUser()?.username }}</div>
                      <small class="opacity-75 text-capitalize">{{ authService.getCurrentUser()?.role }}</small>
                    </div>
                  </div>
                </div>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item" (click)="navigateToProfile()">
                  <i class="bi bi-person me-2"></i>Profile
                </a>
              </li>
              <li>
                <a class="dropdown-item" (click)="navigateToChangePassword()">
                  <i class="bi bi-lock me-2"></i>Change Password
                </a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
              </li>
            </ul>
          </li>
        </ul>

        <!-- Login Button (when not authenticated) -->
        <div *ngIf="!authService.isAuthenticated()" class="ms-auto">
          <a routerLink="/login" class="btn btn-primary btn-sm px-4 text-uppercase fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
