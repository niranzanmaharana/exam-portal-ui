<div class="auth-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-6 col-xl-5">
        <div class="card shadow-lg border-0 rounded-4 auth-card">
          <div class="card-body p-4 p-md-5">
            <!-- Home Link -->
            <div class="mb-3">
              <a routerLink="/home" class="btn btn-link text-decoration-none p-0">
                <i class="bi bi-house-door me-1"></i>Back to Home
              </a>
            </div>

            <!-- Login Form -->
            <div>
              <h2 class="text-center mb-2 form-title">Welcome Back</h2>
              <p class="text-center text-muted mb-4">Sign in to your account</p>
              
              <form (ngSubmit)="onLogin()">
                <div class="mb-3">
                  <label for="login-username" class="form-label">Username</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="login-username" 
                    [(ngModel)]="loginRequest.username" 
                    name="loginUsername"
                    placeholder="Enter your username"
                    required
                  />
                </div>
                
                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <label for="login-password" class="form-label mb-0">Password</label>
                    <a routerLink="/forgot-password" class="text-decoration-none small">Forgot Password?</a>
                  </div>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="login-password" 
                    [(ngModel)]="loginRequest.password" 
                    name="loginPassword"
                    placeholder="Enter your password"
                    required
                  />
                </div>
                
                <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mb-3" role="alert">
                  <i class="bi bi-exclamation-triangle-fill me-2"></i>
                  <div>{{ errorMessage }}</div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 submit-btn" [disabled]="isLoading">
                  <span *ngIf="!isLoading">Sign In</span>
                  <span *ngIf="isLoading">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Loading...
                  </span>
                </button>
                
                <div class="text-center mt-4">
                  <p class="text-muted mb-0">Don't have an account? 
                    <a routerLink="/register" class="text-decoration-none fw-semibold">Create Account</a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
